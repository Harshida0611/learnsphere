{% include 'nav.html' %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Quiz</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f7fc;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        width: 50%;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      h2 {
        color: #333;
      }
      label {
        display: block;
        font-weight: bold;
        margin-top: 10px;
        color: #555;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        margin-top: 15px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        background-color: #007bff;
        color: white;
      }
      button:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Edit Quiz</h2>
      <form method="POST">
        {% csrf_token %}
        <label>Quiz Title:</label>
        <input type="text" name="title" value="{{ quiz.title }}" required />

        <label>Description:</label>
        <textarea name="description" required>{{ quiz.description }}</textarea>

        <label>Due Date:</label>
        <input type="datetime-local" name="due_date" value="{{ quiz.due_date|date:'Y-m-d\TH:i' }}" required />

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </body>
</html>
