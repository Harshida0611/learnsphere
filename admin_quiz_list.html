{% include 'nav.html' %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz List</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f7fc;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .main-content {
        background-image: url('https://img.freepik.com/premium-photo/wide-blue-digital-texture-landing-page-concept_670147-34694.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 120vh;
      }
      .container {
        width: 80%;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
        height: 61%;
      }
      .quiz-list {
        list-style: none;
        padding: 0;
      }
      .quiz-list li {
        background: rgb(128, 174, 223);
        color: white;
        padding: 15px;
        margin: 10px 0;
        border-radius: 5px;
        transition: 0.3s;
        text-align: center;
      }
      .quiz-list li:hover {
        background: rgb(127, 175, 227);
      }
      .quiz-info {
        text-align: center;
      }
      .quiz-list a {
        text-decoration: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
      }
      .button-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
      }
      .button-group a {
        padding: 10px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        display: inline-block;
        transition: background 0.3s, transform 0.2s;
      }
      .edit-btn {
        background: rgb(232, 212, 149);
        color: black;
      }
      .edit-btn:hover {
        background: rgb(218, 190, 120);
      }
      .delete-btn {
        background: rgb(221, 97, 109);
        color: white;
      }
      .delete-btn:hover {
        background: rgb(201, 80, 90);
      }
      .certificate-btn {
        background: rgb(78, 172, 120);
        color: white;
      }
      .certificate-btn:hover {
        background: rgb(68, 150, 100);
      }
    </style>
  </head>
  <body>
    <div class="main-content">
      <div class="container">
        <h2>Available Quizzes</h2>
        <ul class="quiz-list">
          {% for quiz in quizzes %}
            <li>
              <div class="quiz-info">
                <a href="{% url 'quiz_detail' quiz.id %}">{{ quiz.title }}</a>
                <p>📅 Due Date: {{ quiz.due_date }}</p>
              </div>
              <div class="button-group">
                <a href="{% url 'edit_quiz' quiz.id %}" class="edit-btn">✏ Edit</a>
                <a href="{% url 'delete_quiz' quiz.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this quiz?');">🗑 Delete</a>
                <a href="{% url 'certificate_list' %}" class="certificate-btn">🎓 Certificates</a>
              </div>
            </li>
          {% empty %}
            <li>No quizzes available.</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </body>
</html>
