<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8d7da;
        text-align: center;
        padding: 50px;
      }
      
      .container {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: auto;
      }
      
      h2 {
        color: #dc3545;
      }
      
      p {
        font-size: 18px;
        color: #333;
        margin-bottom: 20px;
      }
      
      .fail-icon {
        font-size: 50px;
        color: #dc3545;
      }
      
      .retry-button {
        background-color: #dc3545;
        color: #fff;
        border: none;
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        transition: 0.3s;
        text-decoration: none;
        display: inline-block;
      }
      
      .retry-button:hover {
        background-color: #c82333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="fail-icon">✖</div>
      <h2>Payment Failed!</h2>
      <p>Unfortunately, your payment was not successful. Please try again.</p>
      <a href="/payment" class="retry-button">Retry Payment</a>
    </div>
  </body>
</html>
