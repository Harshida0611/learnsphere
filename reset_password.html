<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Arial', sans-serif;
      }
      
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      
      .container {
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 350px;
      }
      
      h2 {
        margin-bottom: 20px;
        color: #333;
      }
      
      .message {
        color: green;
        font-size: 14px;
        margin-bottom: 10px;
      }
      
      label {
        font-weight: bold;
        display: block;
        margin: 10px 0 5px;
        text-align: left;
      }
      
      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }
      
      button {
        width: 100%;
        padding: 10px;
        background: #ff416c;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
      }
      
      button:hover {
        background: #d81b60;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Your Password</h2>

      {% if messages %}
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <label for="new_password">New Password:</label>
        <input type="password" id="new_password" name="new_password" required placeholder="Enter new password" />

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm password" />

        <button type="submit">Reset Password</button>
      </form>
    </div>
  </body>
</html>
