<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Submissions</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: Arial, sans-serif;
        background-image: url('https://img.freepik.com/premium-photo/wide-blue-digital-texture-landing-page-concept_670147-34694.jpg'); /* Replace with your image path */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 80px; /* Adjusts spacing from the top */
      }
      
      h2 {
        color: #fff;
        font-size: 28px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        margin-top: 15%;
        margin-left: 20%;
      }
      
      table {
        width: 80%;
        max-width: 900px;
        background: #fff;
        border-collapse: collapse;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        overflow: hidden;
        margin-left: 20%;
      }
      
      th,
      td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
      }
      
      th {
        background-color: #007bff;
        color: white;
      }
      
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      
      a {
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
      }
      
      /* Responsive Design */
      @media (max-width: 768px) {
        table {
          width: 95%;
        }
      
        th,
        td {
          padding: 10px;
          font-size: 14px;
        }
      
        h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    {% include 'nav.html' %}

    <h2>Assignment Submissions</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>PDF File</th>
          <th>Submitted At</th>
          <th>Subject</th>
        </tr>
      </thead>
      <tbody>
        {% for submission in submissions %}
          <tr>
            <td>{{ submission.name }}</td>
            <td>{{ submission.email }}</td>
            <td>
              <a href="{{ submission.pdf_file.url }}" target="_blank">View PDF</a>
            </td>
            <td>{{ submission.submitted_at }}</td>
            <td>Web development</td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="4">No submissions yet.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
