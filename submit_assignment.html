<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Assignment</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        text-align: center;
        background-image: url('https://img.freepik.com/premium-vector/grey-white-abstract-technology-background-hi-tech-digital-connect-high-technology-concept_262356-626.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
      form {
        width: 56%;
        margin: auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f9f9f9;
        margin-top: 15%;
      }
      input,
      button {
        width: 90%;
        margin: 10px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    {% include 'stud_nav.html' %}
    <h2>Submit Assignment</h2>

    <form action="{% url 'submit_assignment' %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="text" name="name" placeholder="Enter your name" required /> <br />
      <input type="email" name="email" placeholder="Enter your email" required /> <br />
      <input type="file" name="pdf_file" accept="application/pdf" required /> <br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
