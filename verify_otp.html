<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'css/logo.css' %}" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Arial', sans-serif;
      }
      
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, rgb(34, 39, 44), rgb(115, 73, 184));
      }
      
      .container {
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 350px;
      }
      
      h2 {
        margin-bottom: 20px;
        color: #333;
      }
      
      label {
        font-weight: bold;
        display: block;
        margin: 10px 0 5px;
        text-align: left;
      }
      
      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }
      
      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
      }
      
      button:hover {
        background: #0056b3;
      }
      
      .hidden {
        display: none;
      }
      
      .message {
        color: red;
        font-size: 14px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    {% include 'header.html' %}
    <div class="container">
      <h2>Verify OTP</h2>

      {% if messages %}
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      {% endif %}

      <form id="email-form">
        {% csrf_token %}
        <label for="email">Enter Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email" />
        <button type="button" id="send-otp">Send OTP</button>
      </form>

      <form id="otp-form" method="POST" class="hidden">
        {% csrf_token %}
        <label for="otp">Enter OTP:</label>
        <input type="text" id="otp" name="otp" required placeholder="Enter OTP" />
        <button type="submit">Verify OTP</button>
      </form>
    </div>

    <script>
      $(document).ready(function () {
        $('#send-otp').click(function () {
          var email = $('#email').val()
          if (!email) {
            alert('Please enter your email.')
            return
          }
      
          $.ajax({
            type: 'POST',
            url: "{% url 'send_otp' %}", // Update with your actual URL
            data: JSON.stringify({ email: email }),
            contentType: 'application/json',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
            success: function (response) {
              alert(response.message)
              $('#email-form').hide()
              $('#otp-form').removeClass('hidden')
            },
            error: function (xhr) {
              alert(xhr.responseJSON.message)
            }
          })
        })
      })
    </script>
  </body>
</html>
