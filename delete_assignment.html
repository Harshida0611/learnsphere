{% include 'nav.html' %}
{% block content %}
  <div class="main-content">
    <div class="container mt-5">
      <h2 class="text-center mb-4">Delete Assignment</h2>

      <div class="card shadow p-4">
        <p class="text-center">
          Are you sure you want to delete the assignment titled "<strong>{{ assignment.title }}</strong>"?
        </p>

        <div class="text-center">
          <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Delete</button>
            <a href="{% url 'assignment_list' %}" class="btn btn-secondary btn-lg">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f8fb;
      margin: 0;
      padding: 0;
    }
    .main-content {
      background-image: url('https://img.freepik.com/premium-photo/wide-blue-digital-texture-landing-page-concept_670147-34694.jpg'); /* Replace with your image path */
      background-size: cover; /* Ensures the image covers the whole area */
      background-position: center; /* Centers the image */
      background-repeat: no-repeat;
      height: 100vh;
    }
    
    .container {
      width: 50%;
      margin: 0 auto;
    }
    
    .card {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }
    
    h2 {
      color: #dc3545;
      font-size: 2rem;
    }
    
    .btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 25px;
      transition: all 0.3s ease;
    }
    
    .btn-danger {
      background-color: #dc3545;
      border: none;
    }
    
    .btn-danger:hover {
      background-color: #c82333;
    }
    
    .btn-secondary {
      background-color: #6c757d;
      border: none;
    }
    
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    
    .text-center {
      display: block;
      text-align: center;
    }
  </style>
{% endblock %}
